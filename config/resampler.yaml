# neural-resampler 默认配置
#
# 数值沿用 PC-NSF-HiFiGAN（44.1kHz / hop 512 / 128 mel bin）与 FCPE（16kHz / hop 160 / 128 mel bin）
# 的模型规格，修改前请确认与所用 ONNX 模型一致。
#
# 模型根目录（配置里的相对模型路径都相对该目录解析，勿在 model 字段里重复写 models/）
models_dir: "models"

mel:
  sample_rate: 44100
  n_fft: 2048
  win_size: 2048
  # 声码器帧移（渲染）
  hop_size: 512
  # 分析帧移（更细，用于时域拉伸插值）
  origin_hop_size: 128
  n_mels: 128
  fmin: 40.0
  fmax: 16000.0
  # 动态范围压缩下限：log(clamp(mel, min=clip_val))
  clip_val: 1.0e-9
  # 幅度谱能量地板 sqrt(re²+im²+eps)，0 表示直接取 abs()（与参考实现一致）
  magnitude_eps: 0.0
  # mel 标度公式：slaney（librosa 默认，与训练前处理一致）| htk
  mel_scale: slaney

f0:
  # auto | fcpe | world | none
  backend: auto
  # score（全部来自乐谱） | source（样本整体移调） | hybrid（乐谱 + 样本自然偏移）
  mode: hybrid
  model: "fcpe.onnx"
  sample_rate: 16000
  hop_size: 160
  win_size: 1024
  n_fft: 1024
  mel_bins: 128
  fmin: 0.0
  fmax: 8000.0
  f0_min: 80.0
  f0_max: 880.0
  # 低于该阈值的帧判定为清音
  uv_threshold: 0.006
  # 用分析结果把清音帧 F0 置零
  uv_mask: true
  # hybrid 模式下允许的最大自然偏移（cent）
  max_deviation_cents: 100.0
  # hybrid 基准曲线平滑窗口（毫秒）
  smoothing_ms: 40.0
  # latent→cent 解码方式：local_argmax（FCPE 默认）| argmax
  decoder: local_argmax
  # local_argmax 单侧窗口宽度（总窗口 2×width+1）
  local_argmax_width: 4
  # cent 表对应的频率范围（官方权重为 C1=32.70Hz ~ B6=1975.5Hz）
  cent_f0_min: 32.70
  cent_f0_max: 1975.5
  # F0 分析用 Mel 的动态范围压缩下限
  clip_val: 1.0e-5

vocoder:
  backend: ort
  model: "pc_nsf_hifigan.onnx"
  # 可选：HN-SEP 谐波/噪声分离模型
  hnsep_model: "hnsep.onnx"
  mel_input: "mel"
  f0_input: "f0"
  output: "audio"
  # mel 张量布局：auto（按模型元数据判断）| channels_first [1,n_mels,T] | frames_first [1,T,n_mels]
  mel_layout: auto
  # 按顺序尝试：cpu / directml / cuda / coreml
  providers:
    - cpu

processing:
  # 长音符时对元音段做反射循环拼接
  loop_mode: true
  # 首尾额外保留的帧数
  fill: 6
  # 分析前裁剪静音
  trim_silence: false
  silence_threshold_db: -52.0
  # 默认性别偏移（对应 g 标记，单位 0.01 半音）
  gender: 0

output:
  sample_rate: 44100
  # 16 / 24 / 32：整数 PCM；0：32 位浮点
  bit_depth: 16
  peak_limit: 1.0
  wave_norm: true
  loudness_target: -16.0
  loudness_block_ms: 400.0
  fade_in_ms: 0.0
  fade_out_ms: 0.0

cache:
  enabled: true
  extension: "nrc"
  zstd_level: 3
  dir: null

runtime:
  log_level: "info"
  log_format: "text"
  intra_op_threads: 0
  inter_op_threads: 0
