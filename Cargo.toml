[package]
name = "neural-resampler"
version = "0.1.4"
edition = "2021"
rust-version = "1.77"
description = "通用神经重采样器引擎：纯 Rust + ONNX 重写的 HiFiSampler（FCPE F0 + PC-NSF-HiFiGAN 声码器）"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Henley04/neural-resampler"
keywords = ["utau", "openutau", "resampler", "vocoder", "onnx"]
categories = ["multimedia::audio"]
build = "build.rs"

[[bin]]
name = "resampler"
path = "src/main.rs"

[lib]
name = "neural_resampler"
path = "src/lib.rs"
# cdylib：产出可被外部语言 dlopen/加载的动态库（FFI 见 README）；
# rlib：保留给测试与潜在的内联使用。
crate-type = ["cdylib", "rlib"]

[features]
default = ["onnx"]
# ONNX Runtime 推理后端（ort crate）。关闭后仍可使用内置 DSP 回退管线。
onnx = ["ort"]
# GPU / NPU 执行提供者（按需开启，Windows 上推荐 directml）
directml = ["ort/directml"]
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
# 记录推理耗时等详细指标
telemetry = []

[dependencies]
# ---- 错误处理 ----
anyhow = "1"
thiserror = "2"

# ---- 日志 ----
log = "0.4"
env_logger = "0.11"

# ---- CLI ----
clap = { version = "4", features = ["derive"] }

# ---- ONNX Runtime ----
# download-binaries 会自动获取 ONNX Runtime 预编译库；tls-rustls 是下载所需的 TLS 后端。
# 版本用 `=` 精确锁定：ort 的 rc 预发布版本之间存在破坏性变更
# （rc.10 的 semver 请求会解析到 rc.13，对应 ONNX Runtime 1.28.0）；
# 以 load-dynamic 方式链接时，dylib 版本必须与 ort-sys 期望的精确匹配，
# 否则渲染正常但进程退出阶段会 SIGSEGV。
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "download-binaries",
    "tls-rustls",
    "std",
], optional = true }

# ---- 音频 I/O ----
hound = "3.5"

# ---- 重采样 ----
rubato = "0.16"

# ---- FFT / 频谱 ----
rustfft = "6.2"
realfft = "3.4"

# ---- 压缩缓存 ----
zstd = "0.13"

# ---- 并行 ----
rayon = "1.10"

# ---- 序列化（配置 / 缓存头） ----
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# ---- 文本编码（oto.ini 常见 Shift-JIS） ----
encoding_rs = "0.8"

# ---- Base64（pitchBend 解码） ----
base64 = "0.22"

# ---- 杂项 ----
num-traits = "0.2"
sha2 = "0.10"
dirs = "5"

[dev-dependencies]
approx = "0.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
