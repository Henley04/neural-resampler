name: CI - Build & Test

# 同时覆盖 main 与 master：仓库默认分支可能是两者之一，避免 CI 静默不触发。
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 统一 ort-sys 预编译库缓存位置（覆盖默认的 ~/.cache/ort.pyke.io /
  # ~/Library/Caches/ort.pyke.io / %LOCALAPPDATA%\ort.pyke.io 平台差异），
  # scripts/fetch_ort.sh 与 ort-sys build script 共用。
  ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache ONNX Runtime static libs
        uses: actions/cache@v4
        with:
          path: .ort-cache
          key: ort-static-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # 必须在 fmt/clippy 之前：clippy 也会触发 ort-sys build script 下载。
      # ort-sys 下载失败时只打印 cargo::error 不中断、留下空缓存目录，
      # 最终在 rustc 链接阶段才报 "could not find native static library"。
      # 此脚本自带 SHA-256 校验与重试，把问题提前暴露。
      - name: Fetch & verify ONNX Runtime static libs
        shell: bash
        run: bash scripts/fetch_ort.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      # 注意：不能用 --all-features。GPU 提供者（cuda / directml / coreml）互斥，
      # ort 无法为组合后的 feature set 找到预编译库，会链接失败。
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --verbose 2>&1 | tee build.log

      # 失败时把构建日志尾部写进 annotations 并上传 artifact，便于离线排查
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          grep -E 'error(\[|:)|error: linking|cannot find|undefined reference|note: ' \
            build.log | tail -25 > errs.txt || true
          while IFS= read -r line; do echo "::error::${line:0:480}"; done < errs.txt
          tail -80 build.log > tail.txt
          while IFS= read -r line; do echo "::notice::${line:0:400}"; done < tail.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: |
            build.log
            errs.txt

      - name: Run unit tests
        run: cargo test --lib --verbose

      - name: Run integration tests
        run: cargo test --test '*' --verbose

      - name: Self test (end-to-end smoke)
        run: cargo run --release -- selftest --out-dir target/selftest

      - name: Upload release artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-windows
          path: target/release/resampler.exe

      - name: Upload release artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-linux
          path: target/release/resampler

      - name: Upload release artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-macos
          path: target/release/resampler

  onnx-model-validation:
    name: ONNX Model Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ONNX Runtime
        run: pip install onnxruntime numpy

      - name: Validate FCPE ONNX model
        # 仓库默认不含模型（体积大且受各自许可约束），模型存在时才验证
        if: hashFiles('models/fcpe.onnx') != ''
        run: |
          python -c "
          import onnxruntime as ort
          import numpy as np
          session = ort.InferenceSession('models/fcpe.onnx')
          print('FCPE Inputs:', [(i.name, i.shape) for i in session.get_inputs()])
          print('FCPE Outputs:', [(o.name, o.shape) for o in session.get_outputs()])
          dummy_mel = np.random.randn(1, 100, 128).astype(np.float32)
          outputs = session.run(None, {session.get_inputs()[0].name: dummy_mel})
          print('F0 output shape:', outputs[0].shape)
          assert outputs[0].shape[1] == 100, 'F0 frame count mismatch'
          print('FCPE ONNX validation passed')
          "

      - name: Validate PC-NSF-HiFiGAN ONNX model
        if: hashFiles('models/pc_nsf_hifigan.onnx') != ''
        run: |
          python -c "
          import onnxruntime as ort
          session = ort.InferenceSession('models/pc_nsf_hifigan.onnx')
          print('Vocoder Inputs:', [(i.name, i.shape) for i in session.get_inputs()])
          print('Vocoder Outputs:', [(o.name, o.shape) for o in session.get_outputs()])
          print('Vocoder ONNX validation passed')
          "
