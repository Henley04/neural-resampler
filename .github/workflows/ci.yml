name: CI - Build & Test

# 同时覆盖 main 与 master：仓库默认分支可能是两者之一，避免 CI 静默不触发。
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Windows runner 的 Python stdout 默认 cp1252，脚本含中文输出会炸
  PYTHONUTF8: "1"
  # 统一 ort-sys 预编译库缓存位置（覆盖默认的 ~/.cache/ort.pyke.io /
  # ~/Library/Caches/ort.pyke.io / %LOCALAPPDATA%\ort.pyke.io 平台差异），
  # scripts/fetch_ort.py 与 ort-sys build script 共用。
  ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2：作废旧缓存——ort-sys 的 build script 不声明 rerun-if-env-changed，
          # 旧 target 缓存里缓存的 -L 路径（~/.cache/ort.pyke.io）不会因新增
          # ORT_CACHE_DIR 而刷新，导致 rustc 拿旧路径找不到预取的静态库
          key: v2-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-cargo-

      - name: Cache ONNX Runtime static libs
        uses: actions/cache@v4
        with:
          path: .ort-cache
          key: ort-static-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # 必须在 fmt/clippy 之前：clippy 也会触发 ort-sys build script 下载。
      # ort-sys 下载失败时只打印 cargo::error 不中断、留下空缓存目录，
      # 最终在 rustc 链接阶段才报 "could not find native static library"。
      # 此脚本自带 SHA-256 校验与重试，把问题提前暴露。
      - name: Fetch & verify ONNX Runtime static libs
        shell: bash
        run: |
          set -o pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/fetch_ort.py 2>&1 | tee fetch_ort.log

      - name: Report fetch failure
        if: failure()
        shell: bash
        run: |
          if [ -f fetch_ort.log ]; then
            tail -50 fetch_ort.log > fetch_tail.txt
            while IFS= read -r line; do echo "::error::${line:0:400}"; done < fetch_tail.txt
          else
            echo "::error::预取脚本未能产生任何日志"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      # 双保险：清掉 ort-sys 的 build script 输出缓存，强制重跑以拾取
      # ORT_CACHE_DIR（build script 未声明 rerun-if-env-changed 时不重跑）
      - name: Refresh ort-sys build script cache
        run: cargo clean -p ort-sys

      # 注意：不能用 --all-features。GPU 提供者（cuda / directml / coreml）互斥，
      # ort 无法为组合后的 feature set 找到预编译库，会链接失败。
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --verbose 2>&1 | tee build.log

      # 失败时把构建日志关键行写进 annotations/summary 并上传 artifact。
      # 注意：CARGO_TERM_COLOR=always 下 error 行带 ANSI 色码，必须先去色，
      # 否则 grep 'error:' 匹配不上（曾导致 annotations 只有 Compiling 行）。
      # 另：cargo 失败后其余并行 job 仍会输出大量编译行，error 可能远离
      # 日志末尾，因此对整个日志做宽模式匹配而非只看 tail。
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error::build.log 不存在（失败发生在构建步骤之前）"
            exit 0
          fi
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -c "import re,sys; sys.stdout.write(re.sub(r'\x1b\[[0-9;]*m','',open('build.log',encoding='utf-8',errors='replace').read()))" > build_plain.log
          find .ort-cache -type f 2>/dev/null | head -20 > ort_cache.txt
          grep -c . build_plain.log > nlines.txt || true
          grep -nE 'error(\[|:)|failed to|could not|undefined reference|cannot find' \
            build_plain.log | tail -25 > errs.txt || true
          grep -A20 -m1 'warning: build failed' build_plain.log | tail -20 > ctx.txt || true
          {
            echo "## 构建失败诊断（ubuntu: ${{ runner.os }}）"
            echo "### ort-cache 文件清单"
            '```'
            cat ort_cache.txt
            '```'
            echo "### 匹配到的错误行"
            '```'
            cat errs.txt
            '```'
            echo "### build failed 上下文"
            '```'
            cat ctx.txt
            '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          while IFS= read -r line; do echo "::error::${line:0:400}"; done < errs.txt
          while IFS= read -r line; do echo "::notice::[ort-cache] ${line:0:380}"; done < ort_cache.txt
          while IFS= read -r line; do echo "::notice::[ctx] ${line:0:380}"; done < ctx.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: |
            build.log
            errs.txt

      - name: Run unit tests
        run: cargo test --lib --verbose

      - name: Run integration tests
        run: cargo test --test '*' --verbose

      - name: Self test (end-to-end smoke)
        run: cargo run --release -- selftest --out-dir target/selftest

      - name: Upload release artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-windows
          path: target/release/resampler.exe

      - name: Upload release artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-linux
          path: target/release/resampler

      - name: Upload release artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: resampler-macos
          path: target/release/resampler

  onnx-model-validation:
    name: ONNX Model Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ONNX Runtime
        run: pip install onnxruntime numpy

      - name: Validate FCPE ONNX model
        # 仓库默认不含模型（体积大且受各自许可约束），模型存在时才验证
        if: hashFiles('models/fcpe.onnx') != ''
        run: |
          python -c "
          import onnxruntime as ort
          import numpy as np
          session = ort.InferenceSession('models/fcpe.onnx')
          print('FCPE Inputs:', [(i.name, i.shape) for i in session.get_inputs()])
          print('FCPE Outputs:', [(o.name, o.shape) for o in session.get_outputs()])
          dummy_mel = np.random.randn(1, 100, 128).astype(np.float32)
          outputs = session.run(None, {session.get_inputs()[0].name: dummy_mel})
          print('F0 output shape:', outputs[0].shape)
          assert outputs[0].shape[1] == 100, 'F0 frame count mismatch'
          print('FCPE ONNX validation passed')
          "

      - name: Validate PC-NSF-HiFiGAN ONNX model
        if: hashFiles('models/pc_nsf_hifigan.onnx') != ''
        run: |
          python -c "
          import onnxruntime as ort
          session = ort.InferenceSession('models/pc_nsf_hifigan.onnx')
          print('Vocoder Inputs:', [(i.name, i.shape) for i in session.get_inputs()])
          print('Vocoder Outputs:', [(o.name, o.shape) for o in session.get_outputs()])
          print('Vocoder ONNX validation passed')
          "
